apiVersion: v1
kind: Pod
metadata:
  name: hello-world-1
  labels:
    app: hello-world
spec:
  containers:
    - name: our-web-app
      image: "erichegt/hello-istio:0.1"
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 3000
          protocol: TCP
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 128Mi
      env:
        - name: DELAY_VALUE
          value: "9000"
---

